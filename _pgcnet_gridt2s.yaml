alpha: 0.7
batch_size: 8
config: pgcnet_gridt2s.yaml
dataloader: nvidia_dataloader.NvidiaLoader
device: 0
dynamic_pts_size: false
eval_interval: 1
framesize: 32
freeze: null
ignore_weights: []
log_interval: 50
min_best_acc: 0.0
model: models.gridt2s.PGCNetGridT2S
model_args:
  num_classes: 25
  grid: 16
  embed_dim: 32
  t_dim: 64
  s_dim: 128
  dropout: 0.3
  framesize: 32
  pts_size: 512
num_epoch: 150
num_worker: 4
optimizer_args:
  base_lr: 0.00012
  cosine_start: 75
  eta_min_ratio: 0.01
  lock_start: 100
  nesterov: false
  num_epochs: 150
  optimizer: Adam
  scheduler: constant_then_cosine_then_lock
  start_epoch: 0
  step:
  - 60
  - 70
  - 75
  weight_decay: 0.03
phase: train
print_log: true
pts_size: 512
random_fix: true
random_seed: 0
resume: false
save_interval: 5
strict_load: false
temperature: 3.0
test_batch_size: 8
test_loader_args:
  framerate: 32
  phase: test
train_loader_args:
  framerate: 32
  phase: train
use_soft_labels: false
valid_loader_args: {}
weights: null
work_dir: ./work_dir/pgcnet_gridt2s/
